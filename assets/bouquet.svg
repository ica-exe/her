  <circle cx="250" cy="235" r="26" fill="#fb7185" />
  <circle cx="220" cy="240" r="20" fill="#fda4af" />
  <circle cx="280" cy="240" r="20" fill="#f43f5e" />

  <!-- Floating Sparkles & Blushing Hearts -->
  <text x="250" y="110" font-size="32" text-anchor="middle">💖</text>
  <text x="110" y="270" font-size="28" text-anchor="middle">✨</text>
  <text x="390" y="270" font-size="28" text-anchor="middle">🌸</text>
  <text x="250" y="440" font-family="'Caveat', cursive, sans-serif" font-size="30" fill="#be185d" text-anchor="middle">for you ♡</text>
