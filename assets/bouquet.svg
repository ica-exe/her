  <ellipse cx="190" cy="140" rx="14" ry="35" fill="#fff5f8" stroke="#be185d" stroke-width="4" transform="rotate(15 190 140)"/>
  <circle cx="155" cy="195" r="4" fill="#831843"/>
  <circle cx="185" cy="195" r="4" fill="#831843"/>
  <ellipse cx="145" cy="205" rx="8" ry="4" fill="#f472b6" opacity="0.6"/>
  <ellipse cx="195" cy="205" rx="8" ry="4" fill="#f472b6" opacity="0.6"/>
  <path d="M 167 205 Q 170 210 173 205" fill="none" stroke="#831843" stroke-width="3" stroke-linecap="round"/>

  <!-- Right Character -->
  <circle cx="330" cy="200" r="50" fill="#fff5f8" stroke="#be185d" stroke-width="4"/>
