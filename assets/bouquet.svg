  <ellipse cx="350" cy="140" rx="14" ry="35" fill="#fff5f8" stroke="#be185d" stroke-width="4" transform="rotate(15 350 140)"/>
  <circle cx="315" cy="195" r="4" fill="#831843"/>
  <circle cx="345" cy="195" r="4" fill="#831843"/>
  <ellipse cx="305" cy="205" rx="8" ry="4" fill="#f472b6" opacity="0.6"/>
  <ellipse cx="355" cy="205" rx="8" ry="4" fill="#f472b6" opacity="0.6"/>
  <path d="M 327 205 Q 330 210 333 205" fill="none" stroke="#831843" stroke-width="3" stroke-linecap="round"/>

  <!-- Flower Bouquet in Center -->
  <path d="M 210 380 L 250 280 L 290 380 Z" fill="#fbcfe8" stroke="#be185d" stroke-width="3"/>
  <!-- Ribbon -->
  <path d="M 230 350 Q 250 365 270 350" stroke="#ec4899" stroke-width="8" fill="none"/>
  <circle cx="250" cy="355" r="8" fill="#db2777"/>

  <!-- Tulips / Roses Bouquet Tops -->
  <circle cx="230" cy="260" r="24" fill="#f472b6" />
